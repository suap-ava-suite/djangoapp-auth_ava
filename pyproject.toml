[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-auth-ava"
version = "0.1.0"
description = "App Django com modelos concretos e normalizados para autenticação e sincronização do SUAP no ecossistema AVA"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Kelson da Costa Medeiros", email = "kelsoncm@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<7",
    "django-suap-auth>=1.2.0",
    "django-simple-history>=3.7.0",
    "requests>=2.31",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
]
keywords = ["django", "suap", "auth", "ava", "ifrn", "oauth2", "moodle"]

[project.urls]
Homepage = "https://github.com/suap-ava-suite/djangoapp-auth_ava"
Repository = "https://github.com/suap-ava-suite/djangoapp-auth_ava"
"Bug Tracker" = "https://github.com/suap-ava-suite/djangoapp-auth_ava/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "ruff>=0.4",
    "pre-commit>=3.7",
    "sphinx>=8.0",
    "django-docs-theme>=0.1.8",
]

[tool.setuptools]
packages = { find = { where = ["src"] } }
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js", "*.png", "*.jpg", "*.svg", "*.json"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
addopts = "-v"
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["auth_ava"]
omit = ["tests/*", "docs/*"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["E501"]
