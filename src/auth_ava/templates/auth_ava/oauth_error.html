<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro de Autenticação - SUAP / AVA</title>
    <style>
        :root {
            --color-primary: #1351b4;
            --color-danger: #e52207;
            --color-bg: #f8f9fa;
            --color-card: #ffffff;
            --color-text: #333333;
            --color-text-muted: #666666;
            --radius: 8px;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--color-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            max-width: 540px;
            width: 90%;
            padding: 2.5rem;
            text-align: center;
            border-top: 6px solid var(--color-danger);
        }
        .icon {
            font-size: 3rem;
            color: var(--color-danger);
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 1rem;
            color: #1a1a1a;
        }
        p {
            line-height: 1.6;
            color: var(--color-text-muted);
            margin-bottom: 1.5rem;
        }
        .error-box {
            background-color: #fff1f0;
            border: 1px solid #ffccc7;
            border-radius: 4px;
            padding: 0.75rem 1rem;
            font-family: monospace;
            font-size: 0.875rem;
            color: #cf1322;
            word-break: break-all;
            text-align: left;
            margin-bottom: 1.5rem;
        }
        .actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.2s, color 0.2s;
            cursor: pointer;
        }
        .btn-primary {
            background-color: var(--color-primary);
            color: #ffffff;
            border: 1px solid var(--color-primary);
        }
        .btn-primary:hover {
            background-color: #0c326f;
        }
        .btn-secondary {
            background-color: transparent;
            color: var(--color-text-muted);
            border: 1px solid #d9d9d9;
        }
        .btn-secondary:hover {
            background-color: #f0f0f0;
            color: #333333;
        }
    </style>
</head>
<body>
    <main class="container" role="alert">
        <div class="icon" aria-hidden="true">⚠️</div>
        <h1>Falha na Autenticação SUAP</h1>
        <p>Não foi possível concluir o processo de login com o SUAP. Ocorreu um erro na comunicação ou na validação do seu perfil.</p>

        {% if error %}
        <div class="error-box" role="region" aria-label="Detalhes do erro">
            {{ error }}
        </div>
        {% endif %}

        <div class="actions">
            <a href="{% url 'suap_auth:login' %}" class="btn btn-primary">Tentar Novamente</a>
            <a href="/" class="btn btn-secondary">Voltar ao Início</a>
        </div>
    </main>
</body>
</html>
